[project]
name = "folio"
version = "0.1.0"
description = "Folio: consulta local de novedades editoriales en castellano con evidencias"
readme = "README.md"
authors = [
    { name = "Pedro Pablo Busto Criado", email = "pedropablo.busto@jcyl.es" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.2",
    "numpy>=2.5.4",
    "openai>=3.31.0",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
folio = "folio:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".runtime/pytest-cache"
